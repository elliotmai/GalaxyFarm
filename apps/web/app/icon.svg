<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Galaxy Farm">
  <title>Galaxy Farm</title>
  <!--
    Flying Double M Connected, on its own ground (spec §8).

    The component version takes its colour from the surface's theme tokens.
    A favicon cannot: it is painted by the browser chrome, where no theme is
    set, so the values are literal here and must be kept in step with
    `packages/ui/src/tokens/theme.css` by hand.

    Ink Navy on the day canvas — the app's own ground, and the colour the mark
    is drawn in on every screen inside it. The brand rule is that identity
    carries the whole mark, so this is not inverted for the tile: an icon that
    reversed the mark would be the one place the mark appears backwards.

    A filled ground rather than transparency, because a transparent favicon on
    a dark browser tab shows a dark mark on dark and reads as nothing at all.
    Navy on canvas is 10.75:1, so the mark holds at 16px either way.
  -->
  <rect width="100" height="100" rx="22" fill="#F5F6F8"/>
  <g fill="none" stroke="#1B3A5C" stroke-width="7.84" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 77.89 L27.6 33.09 L38.8 54.37 L50 33.09 L61.2 54.37 L72.4 33.09 L78 77.89"/>
    <path d="M50 33.09 L50 77.89"/>
    <path d="M27.6 33.09 Q18.64 17.41 11.92 24.13 M72.4 33.09 Q81.36 17.41 88.08 24.13"/>
  </g>
</svg>
