<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Galaxy Farm">
  <title>Galaxy Farm</title>
  <!--
    The Rocking Double Star, on its own ground (spec §8).

    The component version takes its colours from the surface's theme tokens.
    A favicon cannot: it is painted by the browser chrome, where no theme is
    set, so the values are literal here and must be kept in step with
    `packages/ui/src/tokens/theme.css` by hand. The two are checked against
    each other in `packages/ui/tests/brand-icons.test.ts`.

    A filled ground rather than transparency, because a transparent favicon on
    a dark browser tab shows a dark mark on dark and reads as nothing at all.
  -->
  <rect width="100" height="100" rx="22" fill="#0E1026"/>
  <!-- A few stars, so the mark reads as a sky rather than as a shape on navy. -->
  <circle cx="17" cy="20" r="1.6" fill="#F2EFE6" opacity="0.75"/>
  <circle cx="83" cy="26" r="1.2" fill="#F2EFE6" opacity="0.55"/>
  <circle cx="28" cy="86" r="1.1" fill="#F2EFE6" opacity="0.45"/>
  <circle cx="88" cy="82" r="1.5" fill="#9D85E8" opacity="0.7"/>
  <g fill="none" stroke="#9D85E8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 78 Q50 98 88 78"/>
  </g>
  <polygon points="50,16 57.94,39.08 82.34,39.49 62.84,54.17 69.99,77.51 50,63.5 30.01,77.51 37.16,54.17 17.66,39.49 42.06,39.08" fill="#F2EFE6" stroke="#F2EFE6" stroke-width="5" stroke-linejoin="round" transform="translate(40 42) scale(0.7059) translate(-50 -50)"/>
  <polygon points="50,16 57.94,39.08 82.34,39.49 62.84,54.17 69.99,77.51 50,63.5 30.01,77.51 37.16,54.17 17.66,39.49 42.06,39.08" fill="#F2EFE6" stroke="#F2EFE6" stroke-width="5" stroke-linejoin="round" transform="translate(72 62) scale(0.3676) translate(-50 -50)"/>
</svg>
