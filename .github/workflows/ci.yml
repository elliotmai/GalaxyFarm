name: CI

# Spec §11.1: every gate below blocks the merge. Nothing here is advisory.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: Tests, architecture and contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # This single run covers the architecture-boundary, route-map, and
      # data-operations gates from §11.1 — they are Vitest suites, not separate
      # tools, so they fail the same way everything else does.
      - name: Unit tests with coverage thresholds
        run: pnpm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm ls @playwright/test --depth 0 --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j[0].devDependencies["@playwright/test"].version)})')" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      # The suite mints its own session cookies rather than driving the login
      # form, so the runner and the server under test have to agree on the
      # secret. A throwaway value: it signs nothing that outlives the job.
      - name: Run e2e
        run: pnpm run test:e2e
        env:
          AUTH_SECRET: e2e-secret-not-for-production

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Applying migrations is a deploy step, not a gate, so it is deliberately not
  # in the `ci` job's `needs` list below — a database that is already up to
  # date must not be able to fail a merge.
  migrate:
    name: Apply migrations
    # Pushes to main only. Never on a pull request: a PR's migrations have not
    # been reviewed yet, and a fork's PR cannot be handed the production
    # connection string at all — secrets are not exposed to fork runs, so the
    # job would fail confusingly rather than do anything useful.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `test` rather than `ci`, and the reason is timing. The migration files
    # are what `migrate-runner.test.ts` applies to an empty PGlite, so this job
    # already waits on the gate that actually validates them; waiting on the
    # full `ci` job would add the twenty-minute e2e run in front of it. Every
    # migration here is additive, and old code ignores a column it does not
    # know about — which is why running one against a build that later fails
    # its e2e is safe, and why running one ten minutes late is not.
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A named environment, so the connection string can be scoped to it and
    # required reviewers can be added later without touching this file.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A warning, not an error. Until the secret is configured this job has
      # nothing it can do, and failing the run for it would put a red cross on
      # every push for a reason that is not a defect in the push — which is
      # how a red build stops meaning anything. The warning is on the run
      # summary where somebody will see it.
      - name: Is the connection string configured?
        id: configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL is not set, so migrations were not applied. Add it as a repository secret — until then a deploy can serve code its schema does not support."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Idempotent by ledger: a re-run of an old commit applies nothing. The
      # command exits non-zero if the schema is still short afterwards, which
      # is the case a green migration run used to hide — so once the secret is
      # there, this failing is a real failure and blocks nothing else.
      - name: Apply pending migrations
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run db:migrate:deployed

  # Single job to point branch protection at, so adding a gate above does not
  # require reconfiguring the protected-branch rules.
  ci:
    name: CI
    if: always()
    needs: [quality, test, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gate passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Gate results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::A required gate did not pass (${result}). See the failing job above."
              exit 1
            fi
          done
          echo "All gates passed."
